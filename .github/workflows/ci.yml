name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 08:00 ART: govulncheck detecta vulnerabilidades nuevas de la stdlib
    # de Go, que Dependabot no cubre.
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínimo declarado en go.mod y la última estable.
        go: ["1.26.9", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
