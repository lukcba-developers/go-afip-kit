name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 08:00 ART: govulncheck detecta vulnerabilidades nuevas de la stdlib
    # de Go, que Dependabot no cubre.
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínimo declarado en go.mod y la última estable.
        go: ["1.26.9", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Download modules
        run: ./.github/scripts/retry.sh go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Se instala a mano en lugar de usar golang/govulncheck-action: el action
      # hace un único `go install` y un corte transitorio del proxy de Go
      # (p. ej. "stream error ... INTERNAL_ERROR") hacía fallar el job sin haber
      # escaneado nada.
      - name: Install govulncheck
        run: ./.github/scripts/retry.sh go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Download modules
        run: ./.github/scripts/retry.sh go mod download
      - name: Run govulncheck
        run: "$(go env GOPATH)/bin/govulncheck ./..."
